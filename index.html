<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0a0a0f"/>
<title>ARAFAT OFFICE AL AI</title>
<link rel="manifest" href="manifest.json"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div id="loginScreen" class="screen active">
  <div class="login-box">
    <h1 class="logo">ARAFAT <span>OFFICE</span> AL AI</h1>
    <p class="sub">Admin Login</p>
    <input id="loginEmail" type="email" placeholder="আপনার Gmail দিন" />
    <input id="loginPass" type="password" placeholder="Password (না দিলেও চলবে)" />
    <button onclick="doLogin()" class="btn primary">🔓 Login</button>
    <p id="loginMsg" class="msg"></p>
  </div>
</div>

<div id="mainApp" class="screen">
  <header class="topbar">
    <div class="brand">ARAFAT OFFICE AL AI</div>
    <div class="userbox">
      <span id="userLabel">Guest</span>
      <button onclick="logout()" class="btn small">Logout</button>
    </div>
  </header>

  <main class="container">

    <section class="prompt-card">
      <label>🔑 API Key Setup</label>
      <div class="row">
        <select id="apiSelect">
          <option value="gemini">Gemini API (Free)</option>
          <option value="openai">OpenAI API (Paid)</option>
        </select>
      </div>
      <div class="row">
        <input id="apiKey" type="password" placeholder="আপনার API Key পেস্ট করুন" />
        <button onclick="toggleKeyView()" class="btn small" id="eyeBtn">👁️</button>
      </div>
      <div class="row">
        <label class="remember">
          <input type="checkbox" id="rememberKey" checked />
          <span>এই Key মনে রাখো</span>
        </label>
      </div>
      <a href="https://aistudio.google.com/app/apikey" target="_blank" class="btn telegram" style="margin-top:10px;">🔑 Free Gemini API Key নিন</a>
      <p class="msg ok" id="keyStatus"></p>
    </section>

    <section class="prompt-card">
      <label>আপনার Prompt লিখুন 👇</label>
      <textarea id="promptInput" placeholder="যেমন: একটি Portfolio Website বানাও..."></textarea>
      <button onclick="generateCode()" class="btn primary" style="margin-top:10px;">✨ Generate Website/App</button>
      <p id="quotaInfo" class="msg"></p>
    </section>

    <section class="output-card">
      <div class="row between">
        <h3>Generated Code</h3>
        <div>
          <button onclick="copyCode()" class="btn small">Copy</button>
          <button onclick="downloadCode()" class="btn small">Download</button>
          <button onclick="previewCode()" class="btn small">Preview</button>
        </div>
      </div>
      <pre id="codeOutput">এখানে Generated Code আসবে...</pre>
    </section>

    <section class="actions-card">
      <a href="https://t.me/arafatsensitivity" target="_blank" class="btn telegram">📢 Telegram Channel</a>
      <button onclick="installApp()" class="btn primary">⬇️ Download App</button>
      <button onclick="activatePremium()" class="btn gold">⭐ Premium Unlock</button>
    </section>

  </main>

  <footer class="foot">© ARAFAT OFFICE AL AI — Powered by Arafat</footer>
</div>

<div id="previewModal" class="modal">
  <div class="modal-inner">
    <div class="row between">
      <h3>Preview</h3>
      <button onclick="closePreview()" class="btn small">✖</button>
    </div>
    <iframe id="previewFrame"></iframe>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
